services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:a42fef2a5ffa1dca8714e12892ba0b8de5c6c513f1bcdb1ffe4143e715cffb45
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - ${BAZARR_CONFIG_PATH}:/config
      - ${JELLYFIN_MOVIES_PATH}:/movies
      - ${JELLYFIN_TV_PATH}:/tv
    deploy:
      update_config:
        order: start-first
    ports:
      - 6767:6767
    restart: always

networks:
  arr: 
    driver: bridge
