services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:a42fef2a5ffa1dca8714e12892ba0b8de5c6c513f1bcdb1ffe4143e715cffb45
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - ${BAZARR_CONFIG_PATH}:/config
      - ${MOVIES_MEDIA_PATH}:/movies
      - ${TV_MEDIA_PATH}:/tv
    deploy:
      update_config:
        order: start-first
    ports:
      - 6767:6767
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:6767/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  arr:
    driver: bridge
