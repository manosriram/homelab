services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:cf7a02a46d37899eeafd1d96b81984168f771f89c554a52a2fd35437fdc16cb6
    container_name: bazarr
    env_file:
      - .env
    volumes:
      - ${BAZARR_CONFIG_PATH}:/config
      - ${JELLYFIN_MOVIES_PATH}:/movies
      - ${JELLYFIN_TV_PATH}:/tv
    deploy:
      update_config:
        order: start-first
    ports:
      - 6767:6767
    restart: always

networks:
  arr: 
    driver: bridge
