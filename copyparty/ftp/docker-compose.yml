services:
  copyparty:
    image: copyparty/ac:latest@sha256:941de3bf7a0ed45b1f0cc2bd12fdb7c89963745e5ec5f2c9b24fc947699ad8bb
    container_name: copyparty
    user: "1000:1000"
    ports:
      - 3923:3923
    restart: always
    volumes:
      - /fs/containers/copyparty/ftp:/cfg:z
      - /fs/containers/copyparty/ftp/data/A:/a:z
      - /fs/backups/warm/metube:/youtube:z
      - /fs/containers/copyparty/ftp/data/B:/b:z
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      PYTHONUNBUFFERED: 1
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
