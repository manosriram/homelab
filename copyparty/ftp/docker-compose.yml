services:
  copyparty:
    image: copyparty/ac:latest@sha256:6d997528ec5e96d68214b92f985b5d227788a5e409af11dadee1c0b7504d8ce1
    container_name: copyparty
    user: "1000:1000"
    ports:
      - 3923:3923
    restart: always
    volumes:
      - /fs/containers/copyparty/ftp:/cfg:z
      - /fs/containers/copyparty/ftp/data/A:/a:z
      - /fs/containers/copyparty/ftp/data/B:/b:z
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      PYTHONUNBUFFERED: 1
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
