services:
  drive:
    image: copyparty/ac:latest@sha256:e6ff5501752dc714473dcfe2da4eddb8d1fbf38b74573e59a0c812758272a9e5
    container_name: drive
    user: "1000:1000"
    ports:
      - 4923:3923
    volumes:
      - /fs/containers/copyparty/drive:/cfg:z
      - /fs/backups/warm/copyparty-drive:/drive:z
      - /fs/media/:/media:z
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      PYTHONUNBUFFERED: 1
    stop_grace_period: 15s
    restart: always
    # healthcheck:
      # test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:4923/?reset=/._"]
      # interval: 1m
      # timeout: 2s
      # retries: 5
      # start_period: 15s
