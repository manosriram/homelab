services:
  drive:
    image: copyparty/ac:latest@sha256:1d8684f0801137355d928c369cec93c28d6127dcc7851a84ade7e6782ea9a1cd
    container_name: drive
    user: "1000:1000"
    ports:
      - 4923:3923
    volumes:
      - /fs/containers/copyparty/drive:/cfg:z
      - /fs/backups/warm/copyparty-drive:/drive:z
      - /fs/media/:/media:z
      - /fs/downloads/:/downloads:z
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      PYTHONUNBUFFERED: 1
    stop_grace_period: 15s
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s
