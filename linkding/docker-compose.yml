services:
  linkding:
    container_name: linkding
    image: sissbruecker/linkding:latest@sha256:e4fbafee44388d8555e34ffdc507224302989265009fc82f5f2762b789f0385a
    ports:
      - 9902:9090
    volumes:
      - /fs/containers/linkding/data:/etc/linkding/data
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s
