services:
  linkding:
    container_name: linkding
    image: sissbruecker/linkding:latest@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
    ports:
      - 9902:9090
    volumes:
      - /fs/containers/linkding/data:/etc/linkding/data
    env_file:
      - .env
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:9090/ >/dev/null 2>&1; elif command -v wget >/dev/null 2>&1; then wget --spider -q http://127.0.0.1:9090/; else echo 'Neither curl nor wget found in container'; exit 1; fi"
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s
