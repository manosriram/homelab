services:
  tubearchivist:
    container_name: tubearchivist
    restart: always
    image: bbilly1/tubearchivist@sha256:83ccd1e372a654654e8cb3c0278256b6889653a4cf239c052bb532401c79daeb
    ports:
      - 8040:8000
    volumes:
      - ${TUBE_ARCHIVIST_MEDIA_PATH}:/youtube
      - ${TUBE_ARCHIVIST_CACHE_PATH}:/cache
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis

  archivist-redis:
    image: redis@sha256:73dad4271642c5966db88db7a7585fae7cf10b685d1e48006f31e0294c29fdd7
    container_name: archivist-redis
    restart: always
    env_file:
      - .env
    volumes:
      - ${TUBE_ARCHIVIST_REDIS_PATH}:/data
    expose:
      - "6379"
    depends_on:
      - archivist-es

  archivist-es:
    image: bbilly1/tubearchivist-es@sha256:58007d1cf7a3b9f3ae4a8e0d2798b05d9c7dd768877b1fe908fd4142da4c68b6         # only for amd64, or use official es 8.18.0
    container_name: archivist-es
    restart: always
    env_file:
      - .env
    environment:
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "xpack.security.enabled=true"
      - "discovery.type=single-node"
      - "path.repo=/usr/share/elasticsearch/data/snapshot"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${TUBE_ARCHIVIST_ES_PATH}:/usr/share/elasticsearch/data    # check for permission error when using bind mount, see readme
    expose:
      - "9200"
