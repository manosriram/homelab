services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:bb50bac26881613af15deb4df891e4a7cb09e3333aec20a0522cb188fb22b11d
    container_name: sonarr
    env_file:
      - .env
    volumes:
      - ${SONARR_CONFIG_PATH}:/config
      - ${JELLYFIN_TV_PATH}:/tv
      - ${JELLYFIN_BACKED_MEDIA_PATH}:/backedup_media
      - ${DELUGE_DOWNLOADS_PATH}:/downloads
    deploy:
      update_config:
        order: start-first
    ports:
      - 8989:8989
    restart: always
    networks: 
      - arr 

networks:
  arr: 
    driver: bridge
