services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:4b8a853b76337cd5de5f69961e23b7d0792ce7bf0a8be083dd7202ef670bfc34
    container_name: sonarr
    env_file:
      - .env
    volumes:
      - ${SONARR_CONFIG_PATH}:/config
      - ${JELLYFIN_TV_PATH}:/tv
      - ${JELLYFIN_BACKED_MEDIA_PATH}:/backedup_media
      - ${DELUGE_DOWNLOADS_PATH}:/downloads
    deploy:
      update_config:
        order: start-first
    ports:
      - 8989:8989
    restart: always
    network_mode: host
    # networks: 
      # - arr 

networks:
  arr: 
    driver: bridge
