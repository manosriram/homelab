services:
  syncthing:
    image: linuxserver/syncthing:latest@sha256:a05d4c8d4b35aa58806b05dd45fd7775b5a38a771891127b17f212d693f9668a
    container_name: syncthing
    hostname: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /fs/containers/syncthing/config:/config
      # - /fs/containers/syncthing/data:/data
      - /fs/backups:/data
    ports:
      - 8384:8384 # Web UI
      - 22000:22000/tcp # Sync protocol
      - 22000:22000/udp # Sync protocol
      - 21027:21027/udp # Discovery
    restart: always
