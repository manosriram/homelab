services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:84fd8a47f58d79a1ad824c27be0a9492750c0fa5216b35c749863093bfa3c3d7
    container_name: vaultwarden
    restart: always
    env_file:
      - .env
    volumes:
      - ${VAULTWARDEN_DATA_PATH}:/data/
    deploy:
      update_config:
        order: start-first
    ports:
      - "8060:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:80/ >/dev/null 2>&1; elif command -v wget >/dev/null 2>&1; then wget --spider -q http://127.0.0.1:80/; else echo 'Neither curl nor wget found in container'; exit 1; fi"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
