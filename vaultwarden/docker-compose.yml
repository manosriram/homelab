services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:d89a6d21e361254670c24a4272b4b5f245e402c284f2f55de2c379fdbcfa1fa5
    container_name: vaultwarden
    restart: always
    env_file:
      - .env
    volumes:
      - ${VAULTWARDEN_DATA_PATH}:/data/
    deploy:
      update_config:
        order: start-first
    ports:
      - "8060:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:80/ >/dev/null 2>&1; elif command -v wget >/dev/null 2>&1; then wget --spider -q http://127.0.0.1:80/; else echo 'Neither curl nor wget found in container'; exit 1; fi"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
