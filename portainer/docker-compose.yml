services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest@sha256:c2353b2bd0dbfaa33faa8895222732e8823a4cf5b57ea664ba631ec3e23d842b
    env_file:
      - .env
    volumes:
      - ${PORTAINER_DATA_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      update_config:
        order: start-first
    ports:
      - 9443:9443
      - 9000:9000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s
volumes:
  data:
