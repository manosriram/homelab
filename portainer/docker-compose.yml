services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest@sha256:264443d4063e0f2633f3ba210ccd69aacf07344dfc792128131dec8963df0f0a
    env_file:
      - .env
    volumes:
      - ${PORTAINER_DATA_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      update_config:
        order: start-first
    ports:
      - 9443:9443
      - 9000:9000
    restart: always
volumes:
  data:
