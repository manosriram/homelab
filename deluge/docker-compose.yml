services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest@sha256:46a63e91e2fc057838f99cb978df3bae35495e4dd51c065b64f7fddbfef81569
    container_name: deluge
    env_file:
      - .env
    volumes:
      - ${DELUGE_CONFIG_PATH}:/config
      - ${DELUGE_DOWNLOADS_PATH}:/downloads
    deploy:
      update_config:
        order: start-first
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846
    restart: always
    networks: 
      - arr 

networks:
  arr: 
    driver: bridge
