services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /root/.var/app/org.qbittorrent.qBittorrent/data/:/config
      - /fs/media/movies:/movies
      - /fs/media/tv:/tv
    ports:
      - 8080:8080
      - 6889:6889
      - 6889:6889/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s
