services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:f08dda38e7d12e5a722d9a5cb6e54acaf63c8598fefeefec88effe0c0d0038dd
    container_name: radarr
    env_file:
      - .env
    volumes:
      - ${RADARR_CONFIG_PATH}:/config
      - ${JELLYFIN_MOVIES_PATH}:/movies
      - ${JELLYFIN_BACKED_MEDIA_PATH}:/backedup_media
      - ${DELUGE_DOWNLOADS_PATH}:/downloads
    deploy:
      update_config:
        order: start-first
    ports:
      - 7878:7878
    restart: always
    networks:
      - arr
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7878/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  arr:
    driver: bridge
