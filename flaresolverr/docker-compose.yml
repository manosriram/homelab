services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:5379a9209c86870558d77c8cdf7efdf300aecf0447617a05dc77e0491d53f34c
    container_name: flaresolverr
    env_file:
      - .env
    deploy:
      update_config:
        order: start-first
    ports:
      - "${PORT}:8191"
    restart: always
    networks:
      - arr

networks:
  arr: 
    driver: bridge
