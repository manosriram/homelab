services:
  metube:
    image: ghcr.io/alexta69/metube@sha256:fe87482a11a86071093438cfb53f6cdcd9c648c248bccc88f3535bd275166fc8
    container_name: metube
    restart: unless-stopped
    ports:
      - "9065:8081"
    volumes:
      - /fs/backups/warm/metube:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
