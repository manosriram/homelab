services:
  metube:
    image: ghcr.io/alexta69/metube@sha256:e9871bd269a246927d01db7b1d84a92409211e49735a41bd59fee0d185f7d65c
    container_name: metube
    restart: unless-stopped
    ports:
      - "9065:8081"
    volumes:
      - /fs/backups/warm/metube:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
