services:
  metube:
    image: ghcr.io/alexta69/metube@sha256:dbbf9a25660b6255cc0726a00c06cf2968941803e29813e1d23863919794713c
    container_name: metube
    restart: unless-stopped
    ports:
      - "9065:8081"
    volumes:
      - /fs/backups/warm/metube:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
