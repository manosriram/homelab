services:
  miniflux:
    image: ${MINIFLUX_IMAGE:-miniflux/miniflux:latest@sha256:fd6587a23884c277301307e4d70c196cd0f772fba1720b9e60051fc65a75121e}
    container_name: miniflux
    restart: always
    ports:
      - "9908:8080"
    depends_on:
      miniflux-postgres:
        condition: service_healthy
    env_file:
      - .env

  miniflux-postgres:
    image: postgres:latest@sha256:ad98a3ba6a3b5e53e9bd95afed6930d3103efc890240643a168b590bcf2e6e81
    container_name: miniflux-postgres
    volumes:
      - /fs/containers/minifluxrss/psql:/var/lib/postgresql/data
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
