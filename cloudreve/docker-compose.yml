services:
  cloudreve:
    image: cloudreve/cloudreve:4.6.0@sha256:31a69b3654942ee7b6a8450e0f775c5e917b7105a199a9e261749c1b20189e3f
    container_name: cloudreve-backend
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    ports:
      - "5212:5212"
    env_file:
      - .env
    volumes:
      - ${CLOUDREVE_DATA_PATH}:/cloudreve/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5212/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgresql:
    image: postgres:17@sha256:14d1abe0b1c660ec3c7521786d1249157699ebc62b07ea84ab6aad5239f5251f
    container_name: cloudreve-psql
    restart: always
    env_file:
      - .env
    volumes:
      - ${CLOUDREVE_PSQL_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudreve -d cloudreve"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest@sha256:acb90ced0bd769b7c04cb4c32c4494ba7b3e0ee068bdbfff0eeb0d31c2a21078
    container_name: cloudreve-redis
    restart: always
    env_file:
      - .env
    volumes:
      - ${CLOUDREVE_REDIS_PATH}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
