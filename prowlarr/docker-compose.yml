services:
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest@sha256:fa81e471a7e46a24b121838563a10d468cf82eecd1587a464c6df4927ecc3248
    env_file:
      - .env
    volumes:
      - ${PROWLARR_CONFIG_PATH}:/config
    deploy:
      update_config:
        order: start-first
    ports:
      - 9696:9696
    restart: always
    networks: 
      - arr 

networks:
  arr: 
    driver: bridge
