services:
  nginx-proxy-manager:
      image: 'jc21/nginx-proxy-manager:latest@sha256:3c5acf6bc3125079906078d0cacec59130018bb32ed64092f7ce495edc68c5ec'
      container_name: nginxproxymanager
      env_file:
        - .env
      volumes:
        - ${NPM_DATA_PATH}:/data
        - ${NPM_LETSENCRYPT_PATH}:/etc/letsencrypt
      deploy:
        update_config:
          order: start-first
      ports:
        - '80:80'
        - '81:81'
        - '443:443'
      networks:
        - proxy-network
      restart: always
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:81/ >/dev/null 2>&1; elif command -v wget >/dev/null 2>&1; then wget --spider -q http://127.0.0.1:81/; else echo 'Neither curl nor wget found in container'; exit 1; fi"
          ]
        interval: 30s
        timeout: 5s
        retries: 10
        start_period: 60s

networks:
  proxy-network:
