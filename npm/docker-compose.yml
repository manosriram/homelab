services:
  nginx-proxy-manager:
      image: 'jc21/nginx-proxy-manager:latest@sha256:1213d6121fa98e7bff0521f002d409d20c3fa7c1c5fe4adf7e3328d27ab111a3'
      container_name: nginxproxymanager
      env_file:
        - .env
      volumes:
        - ${NPM_DATA_PATH}:/data
        - ${NPM_LETSENCRYPT_PATH}:/etc/letsencrypt
      deploy:
        update_config:
          order: start-first
      ports:
        - '80:80'
        - '81:81'
        - '443:443'
      networks:
        - proxy-network
      restart: always

networks:
  proxy-network:
