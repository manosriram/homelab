services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:latest@sha256:7610bbe2e04db0547ed2bf57f57c9ade4d9b05fff9cbba6dc40c41a494ba2e39
    ports:
      - 9900:8080
    env_file:
      - .env
    volumes:
      - ${GATUS_CONFIG_PATH}:/config
      - ${GATUS_DATA_PATH}:/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; elif command -v wget >/dev/null 2>&1; then wget --spider -q http://127.0.0.1:8080/health || wget --spider -q http://127.0.0.1:8080/; else echo 'Neither curl nor wget found in container'; exit 1; fi"
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
